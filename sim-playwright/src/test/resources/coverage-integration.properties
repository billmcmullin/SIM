# Parasoft coverage integration settings for Playwright UI tests.
# Values are resolved from environment variables to avoid committing secrets.

parasoft.coverage.integration.ctp.url=http://ctp:8080/em
parasoft.coverage.integration.ctp.envId=11
parasoft.coverage.integration.dtp.sessionTag=Playwright-Session
parasoft.coverage.integration.ctp.auth.username=admin
parasoft.coverage.integration.ctp.auth.password=admin

# Use the configured user ID without a per-test parallel suffix.
parasoft.coverage.integration.parallel.test.enabled=false
parasoft.coverage.integration.ctp.userId=jonnytest

# Optional manual baggage header override for Playwright requests.
# Command line: -Dparasoft.coverage.baggageHeader="key=value"
# Environment: PARASOFT_COVERAGE_BAGGAGE_HEADER=key=value
