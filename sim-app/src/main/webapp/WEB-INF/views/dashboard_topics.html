<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Popular Topics</title>
    <link rel="stylesheet" href="${contextPath}/assets/css/app.css">
</head>

<body>
    <div class="top-bar">
        <div class="top-bar-inner">
            <div class="brand"><strong>SIM</strong></div>
            <div class="button-row" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <span>Signed in as <strong>${user}</strong></span>
                <button type="button" class="ghost-btn"
                    onclick="if (history.length > 1) { history.back(); } else { window.location.href='${contextPath}/dashboard'; }">
                    Back
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/dashboard'">
                    Dashboard
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/profile'">
                    Profile
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/logout'">
                    Logout
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <section class="section">
            <h1>Popular Topics</h1>
            <p>
                Topic popularity is calculated using Terms from the Terms database.
                By default, <strong>Other Parasoft Match</strong> is excluded.
            </p>

            <!-- simplified / normalized controls -->
            <div id="topicsFilterBar" class="topics-filter-bar">
                <div class="topics-filter-field">
                    <label for="topicDayInput">Day</label>
                    <input id="topicDayInput" type="date">
                </div>

                <label class="topics-filter-check">
                    <input id="topicUseRange" type="checkbox">
                    Use range
                </label>

                <div class="topics-filter-field">
                    <label for="topicStartDateInput">Start</label>
                    <input id="topicStartDateInput" type="date">
                </div>

                <div class="topics-filter-field">
                    <label for="topicEndDateInput">End</label>
                    <input id="topicEndDateInput" type="date">
                </div>

                <button id="topicIncludeOtherBtn" type="button" class="ghost-btn">
                    Include "Other Parasoft Match"
                </button>

                <button id="topicRefreshBtn" type="button" class="ghost-btn">Reset</button>
            </div>


            <div style="margin-top:12px; display:flex; gap:16px; flex-wrap:wrap;">
                <div class="helper-note">Day: <strong id="topicsSummaryDay">--</strong></div>
                <div class="helper-note">Range: <strong id="topicsSummaryRange">--</strong></div>
                <div class="helper-note">Term Mentions: <strong id="topicsSummaryMentions">0</strong></div>
                <div class="helper-note">Unique Chats: <strong id="topicsSummaryUniqueChats">0</strong></div>
            </div>
        </section>

        <section class="section">
            <h2>Topics Across All Widgets</h2>
            <div style="display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;">
                <div style="flex:1 1 520px; min-width:420px;">
                    <div class="table-scroll">
                        <table class="widget-table">
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Topic</th>
                                    <th>Mentions</th>
                                </tr>
                            </thead>
                            <tbody id="globalTopicsBody">
                                ${globalTopicRows}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div style="flex:0 0 360px; width:360px; max-width:100%;">
                    <div class="chart-area" style="height:320px; margin:0;">
                        <canvas id="globalTopicsPieChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <div id="perWidgetTopicsContainer">
            ${perWidgetTopicTables}
        </div>
    </div>

    <script>
        window.dashboardTopicsConfig = {
            contextPath: '${contextPath}'
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="${contextPath}/assets/js/dashboard_topics.js"></script>
</body>

</html>
