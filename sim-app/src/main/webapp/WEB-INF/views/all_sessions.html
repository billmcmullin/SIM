<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Review Sessions</title>
    <script>
        (function () {
            document.documentElement.classList.add('page-boot-loading');
            window.setTimeout(function () {
                document.documentElement.classList.remove('page-boot-loading');
            }, 10000);
        })();
    </script>
    <link rel="stylesheet" href="${contextPath}/assets/css/app.css">
</head>

<body class="sessions-page">
    <div class="top-bar">
        <div class="top-bar-inner">
            <div class="brand"><strong>SIM</strong></div>
            <div class="button-row" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <span>Signed in as <strong>${user}</strong></span>
                <button type="button" class="ghost-btn"
                    onclick="if (history.length > 1) { history.back(); } else { window.location.href='${contextPath}/dashboard'; }">
                    Back
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/dashboard'">
                    Dashboard
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/profile'">
                    Profile
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/logout'">
                    Logout
                </button>
            </div>
        </div>
    </div>

    <main class="container">
        <section class="section">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;">
                <div>
                    <h1 style="margin:8px 0 0 0;">Review Sessions</h1>
                    <p style="margin:6px 0 0 0; color:#475569;">
                        View and drill into sessions across all widgets. Use the controls below to search, filter,
                        expand and select chats for review.
                    </p>
                </div>
            </div>

            <div class="widget-view-controls" style="align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
                <div style="flex:1; display:flex; gap:12px; align-items:center; min-width:320px; flex-wrap:wrap;">
                    <input id="searchInput" type="search"
                        placeholder="Search prompts, responses, session IDs, name, email"
                        style="flex:1; min-width:240px; padding:10px; border-radius:8px; border:1px solid #cbd5f5">
                    <button id="searchBtn" class="ghost-btn">Search</button>
                    <button id="refreshBtn" class="ghost-btn">Clear</button>
                </div>

                <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                    <button id="reviewSelectedBtn" class="ghost-btn" disabled>Review Selected</button>
                    <button id="deselectSelectedBtn" class="ghost-btn" disabled>Deselect all</button>
                    <span id="selectionInfo" style="color:#475569; font-weight:600;"></span>
                </div>
            </div>

            <div id="activityFilterBar"
                style="display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:12px; margin:8px 0 12px 0;">

                <!-- left spacer -->
                <div></div>

                <!-- centered badge area with fixed min height -->
                <div style="display:flex; justify-content:center; min-height:32px;">
                    <div id="activityFilterBadge"
                        style="visibility:hidden; padding:6px 10px; border-radius:999px; font-weight:600; font-size:.9rem; background:#e0f2fe; color:#075985; white-space:nowrap;">
                        Filters applied
                    </div>
                </div>

                <!-- right controls -->
                <div style="display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; align-items:center;">
                    <button id="showAllUsersBtn" class="ghost-btn small" type="button">All users</button>
                    <button id="showActiveUsersBtn" class="ghost-btn small" type="button">Active users</button>
                    <button id="toggleLabeledOnlyBtn" class="ghost-btn small" type="button" aria-pressed="false"
                        style="margin-left:8px;">
                        Only labeled users: Off
                    </button>
                </div>
            </div>


            <div id="summary" class="search-summary"></div>

            <div class="session-table-wrapper">
                <div class="widget-review-table">
                    <table id="sessionsTable" class="session-table">
                        <colgroup>
                            <col style="width:40%">
                            <col style="width:30%">
                            <col style="width:10%">
                            <col style="width:15%">
                            <col style="width:5%">
                        </colgroup>
                        <thead>
                            <tr>
                                <th>Session ID</th>
                                <th>Widgets</th>
                                <th>Chats</th>
                                <th>Last Seen</th>
                                <th style="text-align:right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="sessionsBody">
                            <tr>
                                <td colspan="5" class="empty-row">Loading sessions...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="sessionsPagination" style="margin-top:12px;"></div>
        </section>
    </main>

    <script>
        window.APP_CONTEXT_PATH = '${contextPath}';
        window.ALL_SESSIONS_INITIAL = {
            all: true,
            page: 1,
            limit: 10,
            activity: "all",
            labeledOnly: false
        };
    </script>

    <script src="${contextPath}/assets/js/page_boot_loading.js"></script>
    <script src="${contextPath}/assets/js/all_sessions.js"></script>
</body>

</html>
