<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Inactive Users</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="${contextPath}/assets/css/app.css">
</head>

<body class="inactive-users-page">
    <div class="top-bar">
        <div class="top-bar-inner">
            <div class="brand"><strong>SIM</strong></div>
            <div class="button-row" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <span>Signed in as <strong>${user}</strong></span>
                <button type="button" class="ghost-btn"
                    onclick="if (history.length > 1) { history.back(); } else { window.location.href='${contextPath}/dashboard'; }">
                    Back
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/dashboard'">
                    Dashboard
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/profile'">
                    Profile
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/logout'">
                    Logout
                </button>
            </div>
        </div>
    </div>

    <main class="container">
        <section class="section">
            <h1>Inactive Users</h1>
            <p class="inactive-meta">Showing up to 5 most recent sessions whose last chat is older than the selected
                threshold.</p>

            <div class="inactive-toolbar">
                <label for="daysSelect" style="margin:0;">Inactive for at least:</label>
                <select id="daysSelect">
                    <option value="3">3 days</option>
                    <option value="7">7 days</option>
                    <option value="14">14 days</option>
                    <option value="30">30 days</option>
                </select>
                <button id="applyDaysBtn" type="button" class="ghost-btn">Apply</button>
            </div>
        </section>

        <section class="section">
            <h2>All Widgets</h2>
            <div class="table-scroll">
                <table class="session-table">
                    <thead>
                        <tr>
                            <th>Session</th>
                            <th>Chat Count</th>
                            <th>Frustration</th>
                            <th>Last Entry</th>
                        </tr>
                    </thead>
                    <tbody id="allWidgetsBody">
                        <tr>
                            <td colspan="4" class="empty-row">Loading inactive usersâ€¦</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="section">
            <h2>Per Widget</h2>
            <div id="widgetTablesContainer"></div>
        </section>
    </main>

    <script>
        window.inactiveUsersConfig = {
            contextPath: '${contextPath}',
            defaultDays: '${defaultDays}',
            dataB64: '${inactiveUsersDataB64}'
        };
    </script>
    <script src="${contextPath}/assets/js/inactive_users.js"></script>
</body>

</html>
