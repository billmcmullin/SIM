<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Entry Trends</title>
    <link rel="stylesheet" href="${contextPath}/assets/css/app.css">
</head>

<body>
    <div class="top-bar">
        <div class="top-bar-inner">
            <div class="brand"><strong>SIM</strong></div>
            <div class="button-row" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <span>Signed in as <strong>${user}</strong></span>
                <button type="button" class="ghost-btn"
                    onclick="if (history.length > 1) { history.back(); } else { window.location.href='${contextPath}/dashboard'; }">
                    Back
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/dashboard'">
                    Dashboard
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/profile'">
                    Profile
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/logout'">
                    Logout
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <section class="section">
            <h1>Entry Trends</h1>
            <p>Entries per day across all widget tables.</p>

            <div class="trend-period-row" style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
                <div>
                    <label for="trendDaysSelect">Period</label>
                    <select id="trendDaysSelect">
                        <option value="10">Last 10 days</option>
                        <option value="30">Last 30 days</option>
                        <option value="90">Last 90 days</option>
                        <option value="120">Last 120 days</option>
                        <option value="180">Last 180 days</option>
                    </select>
                </div>

                <div>
                    <div style="font-size:12px; opacity:0.8;">Average Posts / Day</div>
                    <div id="avgPostsPerDay" style="font-size:22px; font-weight:700;">0.00</div>
                </div>

                <div>
                    <div style="font-size:12px; opacity:0.8;">Total Posts</div>
                    <div id="totalPosts" style="font-size:22px; font-weight:700;">0</div>
                </div>
            </div>
        </section>

        <section class="chart-wrapper">
            <h2>Total Entries Trend</h2>
            <div class="chart-area" style="max-width:100%; height:320px;">
                <canvas id="trendChart"></canvas>
            </div>
        </section>

        <div id="widgetTrendCharts"></div>
    </div>

    <script>
        window.trendData = '${trendData}';
        window.trendDaysSelected = '${selectedDays}';
        window.dashboardConfig = { contextPath: '${contextPath}' };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="${contextPath}/assets/js/dashboard_trends.js"></script>
</body>

</html>
