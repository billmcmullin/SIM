openapi: 3.0.3
info:
  title: SIM Chat Server API (SOAtest Starter)
  version: 0.1.0
  description: |
    Starter OpenAPI document generated from the SIM codebase.
    It focuses on API-style endpoints (JAX-RS + servlet JSON/action endpoints)
    so Parasoft SOAtest can import and begin test generation.
servers:
  - url: /chat-server
    description: Context-relative deployment path
tags:
  - name: auth
  - name: admin
  - name: dashboard
  - name: profile
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: User login
      operationId: postApiAuthLogin
      description: Authenticates a user and creates an HTTP session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  username: admin
                  password: change-me
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie (JSESSIONID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUnauthorized'
      security: []

  /admin/widgets:
    get:
      tags: [admin]
      summary: List widgets (admin)
      operationId: getAdminWidgets
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
      security:
        - sessionCookie: []
    post:
      tags: [admin]
      summary: Create/update widget (admin)
      operationId: postAdminWidgets
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
      security:
        - sessionCookie: []
    delete:
      tags: [admin]
      summary: Delete widget (admin)
