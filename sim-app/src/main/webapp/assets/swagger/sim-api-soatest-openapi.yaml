components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID

  requestBodies:
    GenericJsonOrForm:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties:
              type: string

  responses:
    GenericSuccess:
      description: Success (payload format varies by servlet)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
        text/plain:
          schema:
            type: string
        text/html:
          schema:
            type: string

  schemas:
    GenericObject:
      type: object
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginSuccess:
      type: object
      required: [authenticated, username]
      properties:
        authenticated:
          type: boolean
          example: true
        username:
          type: string

    LoginUnauthorized:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          example: false
