services:
  wildfly:
    #Wildfly server instance
    image: quay.io/wildfly/wildfly:latest
    hostname: chatserver
    container_name: chatserver
    user: root
    command: >
      bash -lc '
        microdnf install -y tzdata &&
        ln -snf /usr/share/zoneinfo/America/Los_Angeles /etc/localtime &&
        echo America/Los_Angeles > /etc/timezone || true;
        su -s /bin/bash jboss -c "/opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0"
      '
    ports:
      - 8080:8080
    volumes:
      - ..\sim-app\target\chat-server.war:/opt/jboss/wildfly/standalone/deployments/chat-server.war
    environment:
      DB_HOST: vectorpost
      DB_PORT: 5432
      DB_NAME: chat
      DB_USER: postgres
      DB_PASSWORD: root
      SIM_TRANSLATE_URL: http://libretranslate:5000/translate
      # Generic Key, made by randomkeygen.com
      CONFIG_ENCRYPTION_KEY: 3SKEIyxGENnTp5VAqOEN9BElhaRrVI9SihXD6P5rMeY=
      SIM_EMAIL_CRYPTO_KEY: 3SKEIyxGENnTp5VAqOEN9BElhaRrVI9SihXD6P5rMeY=
      TZ: America/Los_Angeles
    networks:
      - dtp-net
  libreTranslate:
    image: libretranslate/libretranslate:latest
    hostname: libretranslate
    container_name: libretranslate
    stdin_open: true
    tty: true
    environment:
      TZ: America/Los_Angeles
    networks:
      - dtp-net
networks:
  dtp-net:
    external: true
    name: dtp-net
