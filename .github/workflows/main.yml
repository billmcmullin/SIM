name: Build

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven Build (no tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: parasoft/coverage-integration
          ref: master
          path: external/coverage-integration

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build WAR
        run: ./mvnw clean verify -Ddependency-check.skip=true -DskipTests=true
