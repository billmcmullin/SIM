name: Build

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven Build (no tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build WAR
        run: ./mvnw -B -ntp clean package -pl sim-core,sim-web,sim-app,sim-email -am -Dmaven.test.failure.ignore=true -Dmaven.test.error.ignore=true -Ddependency-check.skip=true