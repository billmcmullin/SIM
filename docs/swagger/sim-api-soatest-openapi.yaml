openapi: 3.0.3
info:
  title: SIM Chat Server API (SOAtest Starter)
  version: 0.1.0
  description: |
    Starter OpenAPI document generated from the SIM codebase.
    It focuses on API-style endpoints (JAX-RS + servlet JSON/action endpoints)
    so Parasoft SOAtest can import and begin test generation.
servers:
  - url: /chat-server
    description: Context-relative deployment path
tags:
  - name: auth
  - name: admin
  - name: dashboard
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: User login
      operationId: postApiAuthLogin
      description: Authenticates a user and creates an HTTP session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  username: admin
                  password: change-me
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUnauthorized'

  /admin/widgets:
    get:
      tags: [admin]
      summary: List widgets (admin)
      operationId: getAdminWidgets
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags: [admin]
      summary: Create/update widget (admin)
      operationId: postAdminWidgets
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    delete:
      tags: [admin]
      summary: Delete widget (admin)
      operationId: deleteAdminWidgets
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/save-config:
    post:
      tags: [admin]
      summary: Save admin configuration
      operationId: postAdminSaveConfig
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/test-connection:
    post:
      tags: [admin]
      summary: Test external connection
      operationId: postAdminTestConnection
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TestConnectionRequest'
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestConnectionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'

  /admin/test-salesforce-connection:
    post:
      tags: [admin]
      summary: Test Salesforce connection
      operationId: postAdminTestSalesforceConnection
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/widget-health-config:
    get:
      tags: [admin]
      summary: Get widget health configuration
      operationId: getAdminWidgetHealthConfig
      responses:
        '200':
          description: Widget health configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetHealthConfig'
        '500':
          description: Configuration store not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
    post:
      tags: [admin]
      summary: Update widget health configuration
      operationId: postAdminWidgetHealthConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetHealthConfig'
      responses:
        '200':
          description: Updated widget health configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetHealthConfig'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'

  /admin/db/backup:
    get:
      tags: [admin]
      summary: Export database backup
      operationId: getAdminDbBackup
      responses:
        '200':
          description: ZIP archive of database backup
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: attachment filename for the backup archive
              schema:
                type: string

  /admin/db/import:
    post:
      tags: [admin]
      summary: Import database backup
      operationId: postAdminDbImport
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/salesforce/oauth/start:
    get:
      tags: [admin]
      summary: Start Salesforce OAuth flow
      operationId: getAdminSalesforceOauthStart
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/salesforce/oauth/callback:
    get:
      tags: [admin]
      summary: Salesforce OAuth callback
      operationId: getAdminSalesforceOauthCallback
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/widgets/sync:
    get:
      tags: [admin]
      summary: Get widget sync status
      operationId: getAdminWidgetsSync
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags: [admin]
      summary: Trigger widget sync
      operationId: postAdminWidgetsSync
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/widgets/sync/timer:
    get:
      tags: [admin]
      summary: Get widget sync timer status
      operationId: getAdminWidgetsSyncTimer
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags: [admin]
      summary: Update widget sync timer
      operationId: postAdminWidgetsSyncTimer
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/email/config:
    get:
      tags: [admin]
      summary: Get email configuration
      operationId: getAdminEmailConfig
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags: [admin]
      summary: Update email configuration
      operationId: postAdminEmailConfig
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/email/send:
    post:
      tags: [admin]
      summary: Send test/admin email
      operationId: postAdminEmailSend
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/email/alerts:
    get:
      tags: [admin]
      summary: Get automatic email alert configuration
      operationId: getAdminEmailAlerts
      responses:
        '200':
          description: Automatic email alert configuration and runtime state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoEmailAlertsResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
        '500':
          description: Configuration store not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
    post:
      tags: [admin]
      summary: Save automatic email alert configuration or send a health test email
      operationId: postAdminEmailAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoEmailAlertsRequest'
            examples:
              saveConfig:
                summary: Save alert configuration
                value:
                  healthEnabled: true
                  healthCheckIntervalMinutes: 5
                  healthOfflineDelayMinutes: 5
                  healthResendIntervalMinutes: 30
                  healthRecipients: ops@example.com
                  healthSubject: "SIM Alert: Widget Healthcheck Offline"
                  healthMessage: Follow the runbook if this remains down.
                  healthRunbookUrl: https://docs.example.com/sim/recovery
                  healthRunbookAttachmentPath: D:/SIM/docs/recovery/SIM-Recovery-Runbook.pdf
                  termEnabled: false
              sendHealthTest:
                summary: Send health-style test email
                value:
                  sendTestEmail: true
                  healthRecipients: ops@example.com
                  healthSubject: "SIM Test Alert: Widget Healthcheck Offline"
                  healthMessage: This is a test alert.
                  healthRunbookUrl: https://docs.example.com/sim/recovery
                  healthRunbookAttachmentPath: D:/SIM/docs/recovery/SIM-Recovery-Runbook.pdf
      responses:
        '200':
          description: Saved config or sent test email successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AutoEmailAlertsResponse'
                  - $ref: '#/components/schemas/StatusMessageResponse'
        '400':
          description: Invalid payload or test email send failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
        '500':
          description: Configuration store not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'

  /admin/sync-customer-profile:
    post:
      tags: [admin]
      summary: Sync customer profile from Salesforce
      operationId: postAdminSyncCustomerProfile
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/terms:
    get:
      tags: [admin]
      summary: List terms
      operationId: getAdminTerms
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags: [admin]
      summary: Create term
      operationId: postAdminTerms
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    put:
      tags: [admin]
      summary: Update term
      operationId: putAdminTerms
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    delete:
      tags: [admin]
      summary: Delete term
      operationId: deleteAdminTerms
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/terms/export:
    get:
      tags: [admin]
      summary: Export terms
      operationId: getAdminTermsExport
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/terms/import:
    post:
      tags: [admin]
      summary: Import terms
      operationId: postAdminTermsImport
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/users:
    get:
      tags: [admin]
      summary: List users
      operationId: getAdminUsers
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags: [admin]
      summary: Create user
      operationId: postAdminUsers
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    delete:
      tags: [admin]
      summary: Delete user
      operationId: deleteAdminUsers
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /admin/workspace:
    post:
      tags: [admin]
      summary: Update workspace configuration
      operationId: postAdminWorkspace
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /dashboard/sessions/data:
    get:
      tags: [dashboard]
      summary: Session data (query)
      operationId: getDashboardSessionsData
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
          description: Return all sessions without pagination
        - name: labeledOnly
          in: query
          required: false
          schema:
            type: boolean
          description: Only include sessions with friendly name or email
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term for session ID, label, or chat content
        - name: activity
          in: query
          required: false
          schema:
            type: string
          description: Activity filter
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Page size
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number
      responses:
        '200':
          description: Paginated session summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDataResponse'
    post:
      tags: [dashboard]
      summary: Session data (payload)
      operationId: postDashboardSessionsData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSelectRequest'
      responses:
        '200':
          description: Selected chat snapshots
          content:
            application/json:
              schema:
                type: object

  /dashboard/sessions/chats:
    get:
      tags: [dashboard]
      summary: Session chat list
      operationId: getDashboardSessionsChats
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags: [dashboard]
      summary: Session chat list (payload)
      operationId: postDashboardSessionsChats
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /dashboard/sessions/select:
    get:
      tags: [dashboard]
      summary: Session select values
      operationId: getDashboardSessionsSelect
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags: [dashboard]
      summary: Session select values (payload)
      operationId: postDashboardSessionsSelect
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /dashboard/topics/data:
    get:
      tags: [dashboard]
      summary: Topic analytics data
      operationId: getDashboardTopicsData
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /dashboard/topics/select:
    post:
      tags: [dashboard]
      summary: Topic selection
      operationId: postDashboardTopicsSelect
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /dashboard/trends/select:
    post:
      tags: [dashboard]
      summary: Trend selection
      operationId: postDashboardTrendsSelect
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /dashboard/summary-markdown:
    get:
      tags: [dashboard]
      summary: Daily summary markdown page
      operationId: getDashboardSummaryMarkdown
      parameters:
        - name: day
          in: query
          required: false
          schema:
            type: string
            format: date
          description: ISO local date
        - name: slot
          in: query
          required: false
          schema:
            type: integer
          description: Summary slot index
      responses:
        '200':
          description: HTML summary page
          content:
            text/html:
              schema:
                type: string

  /dashboard/widgets:
    get:
      tags: [dashboard]
      summary: List dashboard widgets
      operationId: getDashboardWidgets
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: Optional widget filter
      responses:
        '200':
          description: Widget list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetListResponse'
    post:
      tags: [dashboard]
      summary: Create dashboard widget
      operationId: postDashboardWidgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WidgetRequest'
      responses:
        '200':
          description: Created or updated widget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetSingleResponse'
    delete:
      tags: [dashboard]
      summary: Delete dashboard widget
      operationId: deleteDashboardWidgets
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated widget IDs
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetDeleteResponse'

  /dashboard/widgets/review/start:
    post:
      tags: [dashboard]
      summary: Start widget review job
      operationId: postDashboardWidgetsReviewStart
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /dashboard/widgets/drilldown/view/data:
    get:
      tags: [dashboard]
      summary: Widget drilldown view data
      operationId: getDashboardWidgetsDrilldownViewData
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /dashboard/widgets/drilldown/view/review-data:
    get:
      tags: [dashboard]
      summary: Widget review data
      operationId: getDashboardWidgetsDrilldownViewReviewData
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /dashboard/widgets/drilldown/review/translate:
    get:
      tags: [dashboard]
      summary: Translate review text (query)
      operationId: getDashboardWidgetsDrilldownReviewTranslate
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags: [dashboard]
      summary: Translate review text (payload)
      operationId: postDashboardWidgetsDrilldownReviewTranslate
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonOrForm'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /dashboard/drilldown/widget-review/job-status:
    get:
      tags: [dashboard]
      summary: Get widget review job status
      operationId: getDashboardDrilldownWidgetReviewJobStatus
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    delete:
      tags: [dashboard]
      summary: Delete widget review job status
      operationId: deleteDashboardDrilldownWidgetReviewJobStatus
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

components:
  requestBodies:
    GenericJsonOrForm:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties:
              type: string

  responses:
    GenericSuccess:
      description: Success (payload format varies by servlet)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
        text/plain:
          schema:
            type: string
        text/html:
          schema:
            type: string

  schemas:
    GenericObject:
      type: object
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginSuccess:
      type: object
      required: [authenticated, username]
      properties:
        authenticated:
          type: boolean
          example: true
        username:
          type: string

    LoginUnauthorized:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          example: false

    StatusMessageResponse:
      type: object
      properties:
        status:
          type: string
          description: ok for success, error for failure
          example: ok
        message:
          type: string
          example: Health test email sent to 1 recipient(s).

    AutoEmailAlertsRequest:
      type: object
      description: |
        Payload for automatic email alerts. If sendTestEmail is true, the endpoint sends a
        health-style test email using the provided health fields and does not persist config.
      properties:
        sendTestEmail:
          type: boolean
          default: false
          description: Send a health-style test email instead of saving configuration.

        healthEnabled:
          type: boolean
        healthCheckIntervalMinutes:
          type: integer
          minimum: 1
        healthOfflineDelayMinutes:
          type: integer
          minimum: 0
        healthResendIntervalMinutes:
          type: integer
          minimum: 1
        healthRecipients:
          type: string
          description: Comma, semicolon, or newline separated email addresses.
        healthSubject:
          type: string
        healthMessage:
          type: string
        healthRunbookUrl:
          type: string
          format: uri
          description: Optional runbook hyperlink included in health alert emails.
        healthRunbookAttachmentPath:
          type: string
          description: Optional server-local file path for runbook attachment.

        termEnabled:
          type: boolean
        termCheckIntervalMinutes:
          type: integer
          minimum: 1
        termName:
          type: string
        termRecipients:
          type: string
          description: Comma, semicolon, or newline separated email addresses.
        termSubject:
          type: string
        termMessage:
          type: string

    AutoEmailAlertsResponse:
      allOf:
        - $ref: '#/components/schemas/StatusMessageResponse'
        - type: object
          properties:
            healthEnabled:
              type: boolean
            healthCheckIntervalMinutes:
              type: integer
            healthOfflineDelayMinutes:
              type: integer
            healthResendIntervalMinutes:
              type: integer
            healthRecipients:
              type: string
            healthSubject:
              type: string
            healthMessage:
              type: string
            healthRunbookUrl:
              type: string
              format: uri
            healthRunbookAttachmentPath:
              type: string

            termEnabled:
              type: boolean
            termCheckIntervalMinutes:
              type: integer
            termName:
              type: string
            termRecipients:
              type: string
            termSubject:
              type: string
            termMessage:
              type: string

            healthLastStatus:
              type: string
            healthLastCheckedAt:
              type: string
            healthOfflineSince:
              type: string
            healthLastAlertAt:
              type: string

            termLastCheckedAt:
              type: string
            termLastCount:
              type: integer
              format: int64
            termLastAlertAt:
              type: string

            updatedBy:
              type: string
            updatedAt:
              type: string

    TestConnectionRequest:
      type: object
      properties:
        serverHost:
          type: string
          description: Target server host
        serverPort:
          type: string
          description: Target server port
        apiKey:
          type: string
          description: API key for the target server
        workspaceName:
          type: string
          description: Workspace name to test

    TestConnectionResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
        authSource:
          type: string
        probe:
          type: string
          example: chat
        upstreamStatus:
          type: integer
        authMode:
          type: string
        upstreamBody:
          type: string

    WidgetHealthConfig:
      type: object
      properties:
        id:
          type: integer
        healthcheckUrl:
          type: string
          format: uri
        healthcheckEnabled:
          type: boolean
        checkIntervalMinutes:
          type: integer
        method:
          type: string
        timeoutMs:
          type: integer
        expectJsonField:
          type: string
        expectJsonValue:
          type: string
        widgetId:
          type: string
        requestOrigin:
          type: string
