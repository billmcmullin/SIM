<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Popular Topics</title>
    <link rel="stylesheet" href="${contextPath}/assets/css/app.css">
</head>

<body>
    <div class="top-bar">
        <div class="top-bar-inner">
            <div class="brand"><strong>SIM</strong></div>
            <div class="button-row" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <span>Signed in as <strong>${user}</strong></span>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/profile'">
                    Profile
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/dashboard'">
                    Dashboard
                </button>
                <button type="button" class="ghost-btn" onclick="window.location.href='${contextPath}/logout'">
                    Logout
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <section class="section">
            <h1>Popular Topics</h1>
            <a class="back-link" href="${contextPath}/dashboard"
                style="display:inline-flex; align-items:center; gap:8px;">
                ← Back to Dashboard
            </a>
            <p>
                Topic popularity is calculated using Terms from the Terms database
                (excluding <strong>Other Parasoft Match</strong>).
            </p>

            <!-- Controls required by dashboard_topics.js -->
            <div class="search-row" style="margin-top:12px;">

                <select id="topicLimitSelect" aria-label="Rows limit" style="min-width:120px; max-width:160px;">
                    <option value="5" selected>Top 5</option>
                    <option value="10">Top 10</option>
                    <option value="20">Top 20</option>
                    <option value="all">All</option>
                </select>


                <button id="topicRefreshBtn" type="button" class="ghost-btn">Reset</button>
            </div>
        </section>

        <section class="section">
            <h2>Top Topics Across All Widgets</h2>
            <div class="table-scroll">
                <table class="widget-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Topic</th>
                            <th>Mentions</th>
                        </tr>
                    </thead>
                    <tbody id="globalTopicsBody">
                        ${globalTopicRows}
                    </tbody>
                </table>
            </div>
        </section>

        <!-- JS will render per-widget topic tables here -->
        <div id="perWidgetTopicsContainer">
            ${perWidgetTopicTables}
        </div>
    </div>

    <script>
        window.dashboardTopicsConfig = {
            contextPath: '${contextPath}'
        };
    </script>
    <script src="${contextPath}/assets/js/dashboard_topics.js"></script>
</body>

</html>
