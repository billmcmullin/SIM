<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Entry Trends</title>
    <link rel="stylesheet" href="${contextPath}/assets/css/app.css">
</head>

<body>
    <div class="top-bar">
        <div class="top-bar-inner">
            <div class="brand">Chat Server</div>
            <div>
                <span>Signed in as <strong>${user}</strong></span>
                <a href="${contextPath}/dashboard">Dashboard</a>
                <a href="${contextPath}/logout">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <section class="section">
            <h1>Entry Trends</h1>
            <a class="back-link" href="${contextPath}/dashboard">
                &larr; Back to dashboard
            </a>
            <p>Entries per day across all widget tables.</p>

            <div class="trend-period-row">
                <label for="trendDaysSelect">Period</label>
                <select id="trendDaysSelect">
                    <option value="7">Last 7 days</option>
                    <option value="30">Last 30 days</option>
                    <option value="90">Last 90 days</option>
                </select>
            </div>
        </section>

        <section class="chart-wrapper">
            <h2>Total Entries Trend</h2>
            <div class="chart-area" style="max-width:100%; height:320px;">
                <canvas id="trendChart"></canvas>
            </div>
        </section>

        <div id="widgetTrendCharts"></div>
    </div>

    <script>
        window.trendData = '${trendData}';
        window.trendDaysSelected = '${selectedDays}';
        window.dashboardConfig = { contextPath: '${contextPath}' };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="${contextPath}/assets/js/dashboard_trends.js"></script>
</body>

</html>
